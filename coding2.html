<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coding Videos</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-image: url(https://images.pexels.com/photos/4836510/pexels-photo-4836510.jpeg?_gl=1*etpkh9*_ga*MTk3NzA2NTQ3My4xNzU2MjMxMTk3*_ga_8JE65Q40S6*czE3NTY2NTY0MDgkbzQkZzEkdDE3NTY2NTY0NzIkajU5JGwwJGgw) alig ;
    }

    h1 {
      text-align: center;
      padding: 20px;
      font-size: 24px;
      color: aliceblue;
    }

    /* Responsive grid for iframes */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
      padding: 20px;
      max-width: 1400px;
      margin: auto;
    }

    iframe {
      width: 100%;
      height: 180px;
      border: none;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      transition: transform 0.2s ease;
    }

    iframe:hover {
      transform: scale(1.03);
    }
  </style>
</head>
<body>
  <h1>This is a page for coding videos</h1>

  <div class="video-grid">
    <iframe src="https://www.youtube.com/embed/KLvJEi3zyEI?si=MTR5uAMge1sX3okN" allowfullscreen></iframe>
    <iframe src="https://www.youtube.com/embed/fzyJTW9bz9E?si=Efa4ZdcNH5iRPvfJ" allowfullscreen></iframe>

    <iframe src="https://www.youtube.com/embed/JEDYWso3qYo?si=QrIWtmR2I82oGKR3" allowfullscreen></iframe>
    <iframe src="https://www.youtube.com/embed/i6pmojRvnFc?si=laVgqVKNqhRJbC2H" allowfullscreen></iframe>
    <iframe src="https://www.youtube.com/embed/fHpnbgEcDh8?si=a1vONQYZWJMnT0nT" allowfullscreen></iframe>
    <iframe src="https://www.youtube.com/embed/_AbFXuGDRTs?si=AFE7Sef7gk_aVGTa" allowfullscreen></iframe>
